/*
 * This file was generated by the Gradle 'init' task.
 */

rootProject.name = 'maven-homework'

include 'mvn-main'

// Auto-test module is only included when the 'testProfile' property is set
// Activate with: ./gradlew build -PtestProfile
if (hasProperty('testProfile')) {
    include 'mvn-test'
    println "\n" + "=" * 60
    println "✅ Модуль 'mvn-test' ВКЛЮЧЕН (testProfile активирован)"
    println "📦 Сборка включает: mvn-main, mvn-test"
    println "=" * 60 + "\n"
} else {
    println "\n" + "=" * 60
    println "⚠️ Модуль 'mvn-test' ИСКЛЮЧЕН"
    println "📦 Сборка включает: mvn-main"
    println "💡 Для включения тестов: ./gradlew build -PtestProfile"
    println "=" * 60 + "\n"
}

